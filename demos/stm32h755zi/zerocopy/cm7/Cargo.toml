[package]
name = "cm7"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cm7"
test = false
bench = false

[profile.dev]
lto = "fat"
opt-level = "s"
incremental = false
codegen-units = 1
debug = true

[profile.release]
lto = "fat"
opt-level = "s"
incremental = false
codegen-units = 1
debug = true

[patch.crates-io]
embassy-futures     = { git = "https://github.com/embassy-rs/embassy",  rev = "8f64a14bebe711962af0136a5acd2b3cef509402" }
embassy-executor    = { git = "https://github.com/embassy-rs/embassy",  rev = "8f64a14bebe711962af0136a5acd2b3cef509402" }
embassy-stm32       = { git = "https://github.com/embassy-rs/embassy",  rev = "8f64a14bebe711962af0136a5acd2b3cef509402" }
embassy-sync        = { git = "https://github.com/embassy-rs/embassy",  rev = "8f64a14bebe711962af0136a5acd2b3cef509402" }
embassy-time        = { git = "https://github.com/embassy-rs/embassy",  rev = "8f64a14bebe711962af0136a5acd2b3cef509402" }

[dependencies]
embassy-futures     = { version = "*" }
embassy-executor    = { version = "*",    features = ["defmt", "arch-cortex-m", "executor-thread"] }
embassy-stm32       = { version = "*",    features = ["defmt", "exti", "stm32h755zi-cm7", "time-driver-tim1"] }
embassy-sync        = { version = "*",    features = ["defmt"] }
embassy-time        = { version = "*",    features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

assign-resources = "0.5"
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2.1.1"

comms   = { path = "../comms" }
ergot   = { path = "../../../../crates/ergot" }
serde   = { version = "1.0", default-features = false, features = ["derive"] }
postcard = { version = "1.1.2", default-features = false }
