[package]
name = "comms"
version = "0.1.0"
edition = "2024"

[patch.crates-io]
embassy-sync        = { git = "https://github.com/embassy-rs/embassy",  rev = "8f64a14bebe711962af0136a5acd2b3cef509402" }

[dependencies]
ergot   = { path = "../../../../crates/ergot" }
serde   = { version = "1.0", default-features = false, features = ["derive"] }
defmt = "1"
postcard = { version = "1.1.2", default-features = false }
embassy-sync        = { version = "*",    features = ["defmt"] }
